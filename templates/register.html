<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Flyware</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form method="POST" action="/register" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600">
        <i class="fas fa-user-plus mr-2"></i> Register
      </h1>
      <p class="text-gray-600 text-sm mt-1">Create your Flyware account</p>
    </div>

    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" id="username" name="username" required
             class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" id="email" name="email" required
             class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="mb-6">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" id="password" name="password" required
             class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:outline-none">
    </div>

    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
      <i class="fas fa-user-check mr-2"></i> Register
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account? <a href="/" class="text-blue-500 hover:underline">Login</a>
    </p>
  </form>
</body>
</html>
