<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flyware Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form method="POST" action="/login" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600">
        <i class="fas fa-plane-departure mr-2"></i> Flyware
      </h1>
      <p class="text-gray-600 text-sm mt-1">Flight Information System</p>
    </div>

    {% if error %}
      <div class="mb-4 text-sm text-red-500">{{ error }}</div>
    {% endif %}

    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" id="username" name="username" required
             class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" id="password" name="password" required
             class="w-full px-4 py-2 border rounded focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="mb-6">
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        <i class="fas fa-sign-in-alt mr-2"></i> Sign In
      </button>
    </div>
    <p class="text-center text-sm text-gray-600">
      No account? <a href="/register" class="text-blue-500 hover:underline">Register</a>
    </p>
  </form>
</body>
</html>
