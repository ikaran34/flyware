<!DOCTYPE html>
<html>
<head>
  <title>Flyware Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <h1 class="text-3xl font-bold mb-6">Flight Timetable</h1>
  <table class="min-w-full bg-white rounded-lg shadow">
    <thead>
      <tr class="bg-gray-200 text-gray-700">
        <th class="py-2 px-4">Flight</th>
        <th class="py-2 px-4">Origin</th>
        <th class="py-2 px-4">Destination</th>
        <th class="py-2 px-4">Departure</th>
        <th class="py-2 px-4">Arrival</th>
        <th class="py-2 px-4">Status</th>
        <th class="py-2 px-4">Alert</th>
      </tr>
    </thead>
    <tbody>
      {% for f in flights %}
      <tr class="border-t">
        <td class="py-2 px-4">{{ f[1] }}</td>
        <td class="py-2 px-4">{{ f[2] }}</td>
        <td class="py-2 px-4">{{ f[3] }}</td>
        <td class="py-2 px-4">{{ f[4] }}</td>
        <td class="py-2 px-4">{{ f[5] }}</td>
        <td class="py-2 px-4">{{ f[6] }}</td>
        <td class="py-2 px-4">
          <form method="POST" action="/alert">
            <input type="hidden" name="flight_id" value="{{ f[0] }}">
            <select name="alert_type" class="border p-1">
              <option value="Delay">Delay</option>
              <option value="Cancel">Cancel</option>
              <option value="Gate Change">Gate Change</option>
            </select>
            <button type="submit" class="bg-blue-400 text-white px-2 py-1 rounded">Set</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="/logout" class="mt-4 inline-block text-red-500">Logout</a>
</body>
</html>
