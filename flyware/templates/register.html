<!DOCTYPE html>
<html>
<head>
  <title>Register - Flyware</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <form method="POST" action="/register" class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-4">Register</h2>
    <input type="text" name="username" placeholder="Username" class="mb-4 w-full p-2 border rounded">
    <input type="email" name="email" placeholder="Email" class="mb-4 w-full p-2 border rounded">
    <input type="password" name="password" placeholder="Password" class="mb-4 w-full p-2 border rounded">
    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Register</button>
    <p class="mt-4 text-sm">Already have an account? <a href="/" class="text-blue-600">Login</a></p>
  </form>
</body>
</html>
