<!DOCTYPE html>
<html>
<head>
  <title>Flyware Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <form method="POST" action="/login" class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-4">Login</h2>
    {% if error %}<p class="text-red-500">{{ error }}</p>{% endif %}
    <input type="text" name="username" placeholder="Username" class="mb-4 w-full p-2 border rounded">
    <input type="password" name="password" placeholder="Password" class="mb-4 w-full p-2 border rounded">
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
    <p class="mt-4 text-sm">No account? <a href="/register" class="text-blue-600">Register here</a></p>
  </form>
</body>
</html>
